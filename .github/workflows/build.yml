name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build and test
        run: ./gradlew build --no-daemon
        env:
          SERVER_PORT: '-1'
          PUBLIC_HTML_ROOT: ${{ runner.temp }}/public_html
          MICRONAUT_SECURITY_ENABLED: 'false'
          MICRONAUT_SECURITY_OAUTH2_CLIENTS_DEFAULT_ENABLED: 'false'
