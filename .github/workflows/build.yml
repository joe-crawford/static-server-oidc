name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build and test
        run: ./gradlew build --no-daemon
        env:
          SERVER_PORT: '-1'
          PUBLIC_HTML_ROOT: ${{ runner.temp }}/public_html
          MICRONAUT_SECURITY_ENABLED: 'false'
          MICRONAUT_SECURITY_OAUTH2_CLIENTS_DEFAULT_ENABLED: 'false'

  image:
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Image name
        env:
          REPOSITORY: ${{ github.repository }}
          ARCH: ${{ matrix.arch }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}:sha-${GITHUB_SHA}-${ARCH}" >> "$GITHUB_ENV"
      - name: Build JVM image with Micronaut
        run: ./gradlew dockerBuild --no-daemon -PdockerImage="$IMAGE"
      - name: Smoke test image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public_html"
          echo 'static-server-oidc image check' > "$RUNNER_TEMP/public_html/index.html"
          trap 'docker logs image-check; docker rm -f image-check' EXIT
          docker run -d --name image-check -p 127.0.0.1:8080:8080 \
            -v "$RUNNER_TEMP/public_html:/public_html:ro" \
            -e SERVER_PORT=8080 -e PUBLIC_HTML_ROOT=/public_html \
            -e MICRONAUT_SECURITY_ENABLED=false \
            -e MICRONAUT_SECURITY_OAUTH2_ENABLED=false "$IMAGE"
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 \
            --max-time 5 http://127.0.0.1:8080/index.html > "$RUNNER_TEMP/response.html"
          grep -Fx 'static-server-oidc image check' "$RUNNER_TEMP/response.html"
          docker rm -f image-check
          docker run -d --name image-check -p 127.0.0.1:8080:8080 \
            -v "$RUNNER_TEMP/public_html:/public_html:ro" \
            -e SERVER_PORT=8080 -e PUBLIC_HTML_ROOT=/public_html \
            -e MICRONAUT_SECURITY_OAUTH2_ENABLED=false "$IMAGE"
          curl --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 \
            --max-time 5 -H 'Accept: text/html' -D "$RUNNER_TEMP/headers.txt" \
            http://127.0.0.1:8080/index.html > /dev/null
          grep -Eq '^HTTP/1.1 303 ' "$RUNNER_TEMP/headers.txt"
          grep -Eiq '^location: /oauth/login/default' "$RUNNER_TEMP/headers.txt"
      - name: Publish architecture image with Micronaut
        run: ./gradlew dockerPush --no-daemon -PdockerImage="$IMAGE"
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Image name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: metadata
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Publish multi-architecture manifest
        env:
          METADATA: ${{ steps.metadata.outputs.json }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(jq -r '.tags[]' <<< "$METADATA")
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          docker buildx imagetools create "${args[@]}" \
            "$IMAGE:sha-$GITHUB_SHA-amd64" "$IMAGE:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "${tags[0]}" --raw | \
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
